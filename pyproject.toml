[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-ml"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "numpy<2.3", 
    "pandas>=2.0",
    "plotly>=5.20",
    "streamlit>=1.35",
]

[tool.setuptools.packages.find]
where = ["src"]

